name: Capstone CI/CD Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Migrations & Populate Data
        run: |
          python server/manage.py makemigrations djangoapp
          python server/manage.py migrate
          python server/manage.py populate

      - name: Run Django Automated Test Suite
        run: |
          python server/manage.py test djangoapp

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build React Frontend
        run: |
          cd server/frontend
          npm install
          npm run build
